<!-- Templates required by the EventPix core. Keep every data-ref / data-tpl name; restyle and restructure freely.
     Rules: no inline <script>, no inline style="" attributes, no external hosts (a strict CSP is enforced). -->

<template data-tpl="login">
  <main class="login">
    <section class="card">
      <p class="eyebrow" data-i18n="eyebrow">You are invited</p>
      <h1 data-ref="event-name"></h1>
      <p class="muted" data-ref="event-description"></p>
      <form data-ref="email-form" class="stack">
        <label for="email" data-i18n="emailLabel">Your e-mail</label>
        <input id="email" data-ref="email" type="email" autocomplete="email" required placeholder="you@example.com">
        <button class="btn btn-primary" type="submit" data-i18n="sendCode">Send me a code</button>
      </form>
      <form data-ref="code-form" class="stack">
        <label for="code" data-i18n="codeLabel">Enter the 6-digit code we e-mailed you</label>
        <input id="code" data-ref="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
        <button class="btn btn-primary" type="submit" data-i18n="viewAlbum">View the album</button>
      </form>
      <p class="error" data-ref="message" role="alert"></p>
    </section>
  </main>
</template>

<template data-tpl="gallery">
  <div class="shell">
    <header class="topbar">
      <h1 data-ref="event-name"></h1>
      <div class="actions">
        <label class="btn btn-primary"><span data-i18n="upload">Add photos &amp; videos</span>
          <input data-ref="upload-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime,video/webm" multiple hidden>
        </label>
        <button class="btn" data-ref="subscribe" type="button" data-i18n="notifyMe">Notify me</button>
        <button class="btn btn-ghost" data-ref="signout" type="button" data-i18n="signout">Sign out</button>
      </div>
    </header>
    <nav class="tabs" data-ref="tabs" role="tablist" aria-label="Albums"></nav>
    <section class="toolbar">
      <a class="btn btn-ghost" data-ref="download-tab" href="#" data-i18n="downloadTab">Download this tab</a>
      <a class="btn btn-ghost" data-ref="download-starred" href="#" data-i18n="downloadStarred">Download starred ★</a>
      <a class="btn btn-ghost" data-ref="download-all" href="#" data-i18n="downloadAll">Download everything</a>
      <button class="btn" data-ref="select" type="button" aria-pressed="false" data-i18n="select">Select</button>
      <button class="btn" data-ref="tab-add" type="button" data-i18n="tabNew">New tab</button>
      <button class="btn" data-ref="tab-rename" type="button" hidden data-i18n="tabRename">Rename</button>
      <button class="btn btn-primary" data-ref="download-selected" type="button" hidden>Download selected</button>
      <span class="progress" data-ref="progress" aria-hidden="true"></span>
      <span class="muted" data-ref="status" role="status"></span>
    </section>
    <main>
      <p class="empty muted" data-ref="empty" data-i18n="empty">Nothing here yet. Be the first to add something!</p>
      <div class="grid" data-ref="grid"></div>
      <div class="sentinel" data-ref="sentinel" aria-hidden="true"></div>
    </main>
  </div>
</template>

<template data-tpl="tab">
  <button class="tab" role="tab" aria-selected="false"><span data-ref="label"></span> <span class="pill" data-ref="count"></span></button>
</template>

<template data-tpl="tile">
  <figure class="tile">
    <button class="tile-open" data-ref="open" type="button" aria-label="Open" data-i18n-aria="ariaOpen"><img data-ref="image" loading="lazy" decoding="async" alt=""><span class="play" aria-hidden="true">▶</span></button>
    <button class="tile-star" data-ref="star" type="button" aria-label="Star" data-i18n-aria="ariaStar">★</button>
  </figure>
</template>

<template data-tpl="lightbox">
  <div class="lightbox" role="dialog" aria-modal="true">
    <div class="lb-stage" data-ref="stage"></div>
    <button class="lb-btn lb-prev" data-ref="prev" aria-label="Previous" data-i18n-aria="ariaPrev">‹</button>
    <button class="lb-btn lb-next" data-ref="next" aria-label="Next" data-i18n-aria="ariaNext">›</button>
    <div class="lb-bar">
      <span class="lb-caption" data-ref="caption"></span>
      <button class="lb-btn lb-star" data-ref="star" aria-label="Star" data-i18n-aria="ariaStar">★</button>
      <a class="lb-btn" data-ref="download" href="#" aria-label="Download" data-i18n-aria="ariaDownload">⬇</a>
      <button class="lb-btn" data-ref="fullscreen" aria-label="Full screen" data-i18n-aria="ariaFullscreen">⛶</button>
      <button class="lb-btn" data-ref="close" aria-label="Close" data-i18n-aria="ariaClose">✕</button>
    </div>
  </div>
</template>

<template data-tpl="unsubscribe">
  <main class="login">
    <section class="card">
      <h1 data-ref="title"></h1>
      <p class="muted" data-ref="message" role="status"></p>
    </section>
  </main>
</template>

<template data-tpl="not-found">
  <main class="login"><section class="card"><h1 data-i18n="notFoundTitle">Nothing here</h1><p class="muted" data-i18n="notFoundText">This link is not valid.</p></section></main>
</template>

<template data-tpl="subscriptions">
  <div class="dialog">
    <section class="card subs">
      <header>
        <h2 data-ref="title" data-i18n="subsTitle">Notifications</h2>
        <button class="btn btn-ghost" data-ref="close" type="button" aria-label="Close" data-i18n-aria="ariaClose">✕</button>
      </header>
      <ul class="subs-list" data-ref="list"></ul>
      <p class="muted" data-ref="empty" data-i18n="subsEmpty">No notifications yet.</p>
      <form class="stack" data-ref="form">
        <label for="subs-channel" data-i18n="subsChannel">Channel</label>
        <select id="subs-channel" data-ref="channel">
          <option value="Email" data-i18n="subsEmail">E-mail</option>
          <option value="Telegram" data-i18n="subsTelegram">Telegram</option>
        </select>
        <label for="subs-tab" data-i18n="subsTab">Album</label>
        <select id="subs-tab" data-ref="tab"></select>
        <label for="subs-mode" data-i18n="subsMode">Frequency</label>
        <select id="subs-mode" data-ref="mode">
          <option value="Instant" data-i18n="subsInstant">Instantly</option>
          <option value="Digest" data-i18n="subsDigest">Daily digest</option>
        </select>
        <button class="btn btn-primary" type="submit" data-i18n="subsAdd">Save</button>
      </form>
      <p class="muted" data-ref="message" role="status"></p>
    </section>
  </div>
</template>

<template data-tpl="sub-row">
  <li class="sub-row">
    <span class="sub-label" data-ref="label"></span>
    <button class="sub-remove" data-ref="remove" type="button" aria-label="Remove" data-i18n-aria="subsRemove">✕</button>
  </li>
</template>

<template data-tpl="tab-editor">
  <div class="dialog">
    <section class="card tab-editor">
      <header>
        <h2 data-ref="title"></h2>
        <button class="btn btn-ghost" data-ref="close" type="button" aria-label="Close" data-i18n-aria="ariaClose">✕</button>
      </header>
      <form class="stack" data-ref="form">
        <label for="tab-name" data-i18n="tabNameLabel">Name</label>
        <input id="tab-name" data-ref="name" maxlength="100" autocomplete="off" required>
        <p class="error" data-ref="message" role="alert"></p>
        <div class="actions">
          <button class="btn btn-danger" data-ref="delete" type="button" hidden data-i18n="tabDelete">Delete tab</button>
          <button class="btn btn-primary" type="submit" data-i18n="tabSave">Save</button>
        </div>
      </form>
    </section>
  </div>
</template>
