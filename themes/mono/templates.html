<!-- EventPix "mono" theme: a dark, editorial second theme whose only job (besides looking sharp)
     is proving the theming contract: same data-tpl / data-ref / data-i18n hooks, different markup,
     different class names, different CSS. Rules: no inline <script>, no inline style="", no external hosts. -->

<template data-tpl="login">
  <main class="gate">
    <section class="sheet">
      <p class="kicker" data-i18n="eyebrow">You are invited</p>
      <h1 class="display" data-ref="event-name"></h1>
      <p class="whisper" data-ref="event-description"></p>
      <form data-ref="email-form" class="column">
        <label for="mono-email" data-i18n="emailLabel">Your e-mail</label>
        <input id="mono-email" data-ref="email" type="email" autocomplete="email" required placeholder="you@example.com">
        <button class="act" type="submit" data-i18n="sendCode">Send me a code</button>
      </form>
      <form data-ref="code-form" class="column">
        <label for="mono-code" data-i18n="codeLabel">Enter the 6-digit code we e-mailed you</label>
        <input id="mono-code" data-ref="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
        <button class="act" type="submit" data-i18n="viewAlbum">View the album</button>
      </form>
      <p class="flash" data-ref="message" role="alert"></p>
    </section>
  </main>
</template>

<template data-tpl="gallery">
  <div class="frame">
    <header class="masthead">
      <h1 class="display" data-ref="event-name"></h1>
      <div class="bench">
        <label class="act"><span data-i18n="upload">Add photos &amp; videos</span>
          <input data-ref="upload-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime,video/webm" multiple hidden>
        </label>
        <button class="act" data-ref="subscribe" type="button" data-i18n="notifyMe">Notify me</button>
        <button class="act ghost" data-ref="signout" type="button" data-i18n="signout">Sign out</button>
      </div>
    </header>
    <nav class="rail" data-ref="tabs" role="tablist" aria-label="Albums"></nav>
    <section class="bench rail-tools">
      <a class="act ghost" data-ref="download-tab" href="#" data-i18n="downloadTab">Download this tab</a>
      <a class="act ghost" data-ref="download-starred" href="#" data-i18n="downloadStarred">Download starred ★</a>
      <a class="act ghost" data-ref="download-all" href="#" data-i18n="downloadAll">Download everything</a>
      <button class="act ghost" data-ref="select" type="button" aria-pressed="false" data-i18n="select">Select</button>
      <button class="act ghost" data-ref="tab-add" type="button" data-i18n="tabNew">New tab</button>
      <button class="act ghost" data-ref="tab-rename" type="button" hidden data-i18n="tabRename">Rename</button>
      <button class="act" data-ref="download-selected" type="button" hidden>Download selected</button>
      <span class="meter" data-ref="progress" aria-hidden="true"></span>
      <span class="whisper" data-ref="status" role="status"></span>
    </section>
    <main>
      <p class="deserted whisper" data-ref="empty" data-i18n="empty">Nothing here yet. Be the first to add something!</p>
      <div class="wall" data-ref="grid"></div>
      <div class="edge" data-ref="sentinel" aria-hidden="true"></div>
    </main>
  </div>
</template>

<template data-tpl="tab">
  <button class="stop" role="tab" aria-selected="false"><span data-ref="label"></span> <span class="tally" data-ref="count"></span></button>
</template>

<template data-tpl="tile">
  <figure class="frame-item">
    <button class="shutter" data-ref="open" type="button" aria-label="Open" data-i18n-aria="ariaOpen"><img data-ref="image" loading="lazy" decoding="async" alt=""><span class="cine" aria-hidden="true">▶</span></button>
    <button class="mark" data-ref="star" type="button" aria-label="Star" data-i18n-aria="ariaStar">★</button>
  </figure>
</template>

<template data-tpl="lightbox">
  <div class="darkroom" role="dialog" aria-modal="true">
    <div class="easel" data-ref="stage"></div>
    <button class="knob back" data-ref="prev" aria-label="Previous" data-i18n-aria="ariaPrev">‹</button>
    <button class="knob forth" data-ref="next" aria-label="Next" data-i18n-aria="ariaNext">›</button>
    <div class="ledge">
      <span class="plaque" data-ref="caption"></span>
      <button class="knob" data-ref="star" aria-label="Star" data-i18n-aria="ariaStar">★</button>
      <a class="knob" data-ref="download" href="#" aria-label="Download" data-i18n-aria="ariaDownload">⬇</a>
      <button class="knob" data-ref="fullscreen" aria-label="Full screen" data-i18n-aria="ariaFullscreen">⛶</button>
      <button class="knob" data-ref="close" aria-label="Close" data-i18n-aria="ariaClose">✕</button>
    </div>
  </div>
</template>

<template data-tpl="unsubscribe">
  <main class="gate">
    <section class="sheet">
      <h1 class="display" data-ref="title"></h1>
      <p class="whisper" data-ref="message" role="status"></p>
    </section>
  </main>
</template>

<template data-tpl="not-found">
  <main class="gate"><section class="sheet"><h1 class="display" data-i18n="notFoundTitle">Nothing here</h1><p class="whisper" data-i18n="notFoundText">This link is not valid.</p></section></main>
</template>

<template data-tpl="subscriptions">
  <div class="veil">
    <section class="sheet panel">
      <header class="panel-head">
        <h2 class="sub-display" data-ref="title" data-i18n="subsTitle">Notifications</h2>
        <button class="act ghost" data-ref="close" type="button" aria-label="Close" data-i18n-aria="ariaClose">✕</button>
      </header>
      <ul class="ledger" data-ref="list"></ul>
      <p class="whisper" data-ref="empty" data-i18n="subsEmpty">No notifications yet.</p>
      <form class="column" data-ref="form">
        <label for="mono-subs-channel" data-i18n="subsChannel">Channel</label>
        <select id="mono-subs-channel" data-ref="channel">
          <option value="Email" data-i18n="subsEmail">E-mail</option>
          <option value="Telegram" data-i18n="subsTelegram">Telegram</option>
        </select>
        <label for="mono-subs-tab" data-i18n="subsTab">Album</label>
        <select id="mono-subs-tab" data-ref="tab"></select>
        <label for="mono-subs-mode" data-i18n="subsMode">Frequency</label>
        <select id="mono-subs-mode" data-ref="mode">
          <option value="Instant" data-i18n="subsInstant">Instantly</option>
          <option value="Digest" data-i18n="subsDigest">Daily digest</option>
        </select>
        <button class="act" type="submit" data-i18n="subsAdd">Save</button>
      </form>
      <p class="whisper" data-ref="message" role="status"></p>
    </section>
  </div>
</template>

<template data-tpl="sub-row">
  <li class="entry">
    <span class="entry-text" data-ref="label"></span>
    <button class="entry-drop" data-ref="remove" type="button" aria-label="Remove" data-i18n-aria="subsRemove">✕</button>
  </li>
</template>

<template data-tpl="tab-editor">
  <div class="veil">
    <section class="sheet panel">
      <header class="panel-head">
        <h2 class="sub-display" data-ref="title"></h2>
        <button class="act ghost" data-ref="close" type="button" aria-label="Close" data-i18n-aria="ariaClose">✕</button>
      </header>
      <form class="column" data-ref="form">
        <label for="mono-tab-name" data-i18n="tabNameLabel">Name</label>
        <input id="mono-tab-name" data-ref="name" maxlength="100" autocomplete="off" required>
        <p class="whisper" data-ref="message" role="alert"></p>
        <div class="spread">
          <button class="act danger" data-ref="delete" type="button" hidden data-i18n="tabDelete">Delete tab</button>
          <button class="act" type="submit" data-i18n="tabSave">Save</button>
        </div>
      </form>
    </section>
  </div>
</template>
