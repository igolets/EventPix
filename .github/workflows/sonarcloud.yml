name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Analysis results are uploaded with the SONAR_TOKEN secret; GITHUB_TOKEN only needs read access.
permissions:
  contents: read

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    if: github.actor != 'dependabot[bot]'   # Dependabot PRs get no repo secrets, so the token would be empty
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 21
          distribution: 'zulu' # Alternative distribution options are available.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"igolets_EventPix" /o:"igolets" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" "/d:sonar.issue.ignore.multicriteria=e1" "/d:sonar.issue.ignore.multicriteria.e1.ruleKey=Web:S6850" "/d:sonar.issue.ignore.multicriteria.e1.resourceKey=**/templates.html" "/d:sonar.cs.opencover.reportsPaths=${{ github.workspace }}\TestResults\**\coverage.opencover.xml" "/d:sonar.exclusions=**/Migrations/**" "/d:sonar.cpd.exclusions=**/themes/**/templates.html" "/d:sonar.coverage.exclusions=**/wwwroot/**"
          dotnet build --no-incremental
          dotnet test --no-build --collect:"XPlat Code Coverage" --settings tests/coverlet.runsettings --results-directory "${{ github.workspace }}\TestResults"
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"